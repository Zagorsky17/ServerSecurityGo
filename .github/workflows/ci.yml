# Проверки на каждый push и pull request: форматирование, vet, тесты
# (на ubuntu выполняется и тест на настоящем /proc), shellcheck скриптов,
# кросс-сборка.
name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt и vet
        run: make vet
      - name: Тесты
        run: go test -race -v ./...
      - name: Тест настоящего /proc от root
        # Тестовый бинарник собираем от пользователя (чтобы не испортить
        # права на кеш сборки), а запускаем от root.
        run: |
          go test -c -o /tmp/procfs.test ./internal/procfs
          sudo /tmp/procfs.test -test.v -test.run TestRealProc
      - name: Процессы, модули и dpkg на настоящем Linux
        run: |
          go test -race -c -o /tmp/rootkit.test ./internal/rootkit
          go test -race -c -o /tmp/integrity.test ./internal/integrity
          sudo /tmp/rootkit.test -test.v -test.run '^TestReal'
          sudo /tmp/integrity.test -test.v -test.run '^TestReal'
          go test -race -c -o /tmp/ufw.test ./internal/ufw
          sudo /tmp/ufw.test -test.v -test.run '^TestReal'
          go test -race -c -o /tmp/fsinspect.test ./internal/fsinspect
          sudo /tmp/fsinspect.test -test.v -test.run '^TestRealFileCapabilitiesAndSUID$'
      - name: Настоящие метаданные Docker без запуска контейнера
        run: bash .github/scripts/container-security.sh
      - name: Разовое сканирование настоящей системы
        run: |
          go build -o /tmp/ssg ./cmd/serversecuritygo
          # --fail-on none: находки на раннере CI (сборки из /tmp) не должны
          # ронять шаг; коды выхода проверяет отдельный тест.
          # Быстрый scan явно неполон: обход PID и хеширование требуют --full.
          set +e
          sudo /tmp/ssg scan --min-risk INFO --fail-on none > /tmp/scan.txt
          code=$?
          set -e
          test "$code" = 3
          head -40 /tmp/scan.txt
          set +e
          sudo /tmp/ssg scan --format json --min-risk INFO --fail-on none > /tmp/scan.json
          code=$?
          set -e
          test "$code" = 3
          python3 -c "import json; d=json.load(open('/tmp/scan.json')); assert d['schema_version']==1 and d['incomplete'] and d['stats']['total']>10, d['stats']; print('процессов:', d['stats']['total'], 'сокетов:', d['stats']['sockets']); [print('security diagnostic:', json.dumps(f, ensure_ascii=False)) for f in d['system'] if f['id'] in ('pam_module_unusual', 'persistence_unavailable', 'package_ownership_unavailable')]"
      - name: Настоящий systemd-юнит и watchdog
        run: sudo --preserve-env=GITHUB_ACTIONS bash .github/scripts/selfcheck-systemd.sh /tmp/ssg
      - name: Полный обход PID и файлов настоящего Linux
        timeout-minutes: 35
        run: |
          set +e
          sudo /tmp/ssg scan --full --format json --output /tmp/full-scan.json --min-risk INFO --fail-on none
          code=$?
          set -e
          # В разовом запуске нет эталона установки самоконтроля.
          test "$code" = 3
          sudo python3 - <<'PYCODE'
          import json
          d = json.load(open('/tmp/full-scan.json'))
          findings = d['system']
          ids = {f['id'] for f in findings}
          assert 'rootkit_sweep_complete' in ids, findings
          assert 'integrity_complete' in ids, findings
          inventory = d['inventory']
          assert inventory and inventory['scanned'] > 100 and inventory['scope'], inventory
          assert 'fs_inventory_pending' not in ids, findings
          print('Filesystem inventory:', inventory['scanned'], 'paths; incomplete:', inventory['incomplete'])
          assert 'self_check_unavailable' in ids and d['incomplete'], findings
          assert not ids.intersection({'hidden_process', 'kmod_hidden', 'rootkit_sweep_pending', 'integrity_pending'}), findings
          print('System finding IDs:', sorted(ids), 'incomplete:', d['incomplete'])
          PYCODE
      - name: Аудит настроек настоящей системы
        run: |
          # Быстрый аудит явно сообщает, что полный инвентарь ещё не получен.
          set +e
          sudo /tmp/ssg audit --all --fail-on none > /tmp/audit.txt
          code=$?
          set -e
          test "$code" = 3
          head -80 /tmp/audit.txt
          set +e
          sudo /tmp/ssg audit --format json --fail-on none > /tmp/audit.json
          code=$?
          set -e
          test "$code" = 3
          python3 - <<'PYCODE'
          import json
          d = json.load(open('/tmp/audit.json'))
          checks = {c['id']: c for c in d['checks']}
          assert d['schema_version'] == 1 and len(checks) > 60, d
          assert all(checks[k]['status'] == 'unknown' for k in ('fs_suid_inventory', 'fs_capabilities')), checks
          assert checks['kern_aslr']['status'] != 'unknown', checks['kern_aslr']
          assert checks['upd_eol_release']['status'] != 'unknown', checks['upd_eol_release']
          print('Audit:', len(checks), d['summary'])
          PYCODE
          set +e
          sudo /tmp/ssg audit --format html --output /tmp/audit.html --fail-on none
          code=$?
          set -e
          test "$code" = 3
          test "$(sudo stat -c %a /tmp/audit.html)" = 600
          # Код выхода: ошибка неверного флага — 2.
          set +e; /tmp/ssg audit --fail-on bogus; code=$?; set -e
          test "$code" = 2
      - name: Расследование и сбор улик
        run: |
          go test -race -c -o /tmp/collect.test ./internal/collect
          sudo /tmp/collect.test -test.v -test.run '^TestRealDeletedExecutable$'
          bash .github/scripts/investigation.sh /tmp/ssg
      - name: Кросс-сборка
        run: make build-linux
      - name: shellcheck
        run: shellcheck -x scripts/*.sh .github/scripts/*.sh
