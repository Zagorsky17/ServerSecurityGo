<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Вход — ServerSecurityGo</title>
<link rel="stylesheet" href="/static/style.css">
<script src="/static/login.js" defer></script>
</head>
<body class="login-page">
<form id="login" class="login-box" autocomplete="on">
  <h1>ServerSecurityGo</h1>
  <p class="muted">Панель мониторинга процессов. Введите пароль администратора.</p>
  <label for="password">Пароль</label>
  <input type="password" id="password" name="password" autocomplete="current-password" required autofocus>
  <button type="submit">Войти</button>
  <p id="err" class="error hidden" role="alert"></p>
</form>
</body>
</html>
